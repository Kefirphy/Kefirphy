    <radialGradient id="n3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d0409a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d0409a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="200" rx="18"/></clipPath>
  </defs>

  <style>
    .s, .b, .k {
      animation-name: tw;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    .b { animation-name: blink; }
    .k {
      animation-name: spark;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes tw    { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
    @keyframes blink { 0%, 100% { opacity: 0 }   50% { opacity: 1 } }
    @keyframes spark {
      0%, 100% { opacity: 0; transform: scale(.4) }
      50%      { opacity: 1; transform: scale(1) }
    }
    @media (prefers-reduced-motion: reduce) {
      .s, .b, .k { animation: none; opacity: .8 }
    }
  </style>

