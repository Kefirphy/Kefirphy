  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04050d"/>
      <stop offset="0.55" stop-color="#0a0a22"/>
      <stop offset="1" stop-color="#150b30"/>
    </linearGradient>
    <radialGradient id="n1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6a3df0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6a3df0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="n2" cx="0.5" cy="0.5" r="0.5">
